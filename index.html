  const keys=state.query.normalize('NFKC').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  const items=Array.from(byId.values()).filter(i=>{
    if(state.category!=='all'&&i.category!==state.category)return false;
    const hay=[i.name,i.tag,i.date,i.amount,i.summary,i.insight,...labelFor(i),...(categories[i.category]||[]),...(i.links||[]).map(link=>link.label)].join(' ').normalize('NFKC').toLocaleLowerCase();
    return keys.every(key=>hay.includes(key));
  });
  $('#grid').replaceChildren(...items.map(card));
  $('#count').textContent=items.length+' 条资料';
  $('#empty').hidden=Boolean(items.length);
  $('#empty-copy').textContent=DATA.length?'没有符合条件的资料，试试其他关键词。':'暂无收录资料。';
  $('#reset').hidden=!DATA.length;
  for(const b of $('#filters').children)b.setAttribute('aria-pressed',String(b.dataset.category===state.category));
}
function addSection(root,title,copy,note=false){
  if(!copy)return;
  root.append(h('h3','',title),h('p','section-copy'+(note?' note':''),copy));
}
function openItem(item){
  previousFocus=document.activeElement;
  const cover=art(item);$('#detail-cover').replaceChildren(cover);const detail=$('#detail');const [bg,ink]=palettes[item.index%palettes.length];detail.style.setProperty('--card-accent',ink);detail.style.setProperty('--card-bg',bg);
  const m=meta(item), name=h('h2','',item.name);name.id='detail-title';
  const content=$('#detail-content');content.replaceChildren(m,name);
  if(item.amount)content.append(h('p','amount',item.amount));
  addSection(content,'这份资料讲什么',item.summary);
  addSection(content,'给创作者的启发',item.insight,true);
  const list=h('ul','source-list');
  for(const src of item.links||[]){const u=safeURL(src.url);if(!u)continue;const link=h('a');link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';link.append(h('span','',src.label||'查看来源'),h('small','',u.hostname));const li=h('li');li.append(link);list.append(li);}
  if(list.children.length)content.append(h('h3','', '原始资料与出处'),list);
  detail.showModal();document.body.classList.add('modal-open');$('.close-button').focus({preventScroll:true});detail.scrollTop=0;
}
for(const [key,label] of all){const button=h('button','',label);button.type='button';button.dataset.category=key;$('#filters').append(button);}
$('#filters').addEventListener('click',ev=>{const b=ev.target.closest('[data-category]');if(!b)return;state.category=b.dataset.category;render()});
$('#query').addEventListener('input',ev=>{state.query=ev.target.value;render()});
$('#reset').addEventListener('click',()=>{state={category:'all',query:''};$('#query').value='';render();$('#query').focus()});
$('#grid').addEventListener('click',ev=>{const b=ev.target.closest('button[data-id]');if(b&&byId.has(b.dataset.id))openItem(byId.get(b.dataset.id))});
$('.close-button').addEventListener('click',()=>$('#detail').close());
$('#detail').addEventListener('click',ev=>{if(ev.target===$('#detail')){const r=ev.target.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)ev.target.close();}});
$('#detail').addEventListener('close',()=>{document.body.classList.remove('modal-open');if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});});
render();
</script>
</body>
</html>
